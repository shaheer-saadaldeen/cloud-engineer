name: CI-CD

on:
  push:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t cloud-engineer-app .

      - name: Run Docker container
        run: |
          docker run -d --name cloud-app cloud-engineer-app
          docker ps
